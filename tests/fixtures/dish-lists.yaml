# Корпус «Мої страви — додати списком» (SPEC.md D123). Гілки 1–2 (вже є, усе з бази) і склеювання повторів — юніт-тест
# без мережі (tests/unit/dishList.test.ts); гілки 3–4 через живий сервер — `npm run eval:dishes`.
# exists — назва вже є (своя страва, вбудована, картка Харчоблоку або продукт бази — «Голубці» там готова страва); local — розкладено на телефоні; to_ai — піде до ІІ;
# draft — лише назва: заготовка «Потрібен склад», без запиту й без чисел (ТЗ v1.0, R08); not_dish — не страва, без запиту.
# Названия поправлено під базу (дозволено ТЗ): «Сирники» — синонім вбудованої «Сирники зі сметаною», тож локальний рядок —
# «Сирники домашні», омлет і яєчня — теж вбудовані («Яйця з помідорами», «Яйця на олії»); заготовка — «Пиріг бабусин»; «Гречка з грибами» — вбудована страва, тож рядок до ІІ — «Гречка з опеньками»; борошно додано в базу (D123).
# status: fixed | open; рядки не видаляються.

- id: list-mixed
  input: |
    Сирники домашні — сир 5 % 400 г, 2 яйця, борошно 3 ст. л., на пательні, на 4 порції
    сирники  домашні — сир 5 % 400 г, 2 яйця, борошно 3 ст. л., на пательні, на 4 порції
    Борщ
    Гречка з опеньками: гречка, опеньки, цибуля, олія
    Голубці
    Пиріг бабусин
  expect:
    duplicates_merged: 1
    exists: ["Борщ", "Голубці"]
    local: ["Сирники домашні"]
    to_ai: ["Гречка з опеньками"]
    draft: ["Пиріг бабусин"]
    ai_requests: 1
  status: fixed

- id: list-roundtrip
  input_file: dishes-export-sample.csv
  expect: { ai_requests: 0, local: ["Яйця з помідорами", "Вівсянка з бананом"], rows: 2 }
  status: fixed

- id: list-cp1251
  input_file: dishes-cp1251.csv
  expect: { read: true, rows: 5 }
  status: fixed

- id: list-not-a-dish
  input: |
    купити хліб
    Салат з тунцем — тунець, яйце, огірок
  expect: { not_dish: ["Купити хліб"], to_ai: ["Салат з тунцем"] }
  status: fixed

- id: list-numbered
  input: |
    1. Яйця на олії - 2 яйця, олія 5 г
    • Кефір з бананом: кефір 1 склянка, банан 1 шт.

    3) Лаваш-рол
  expect: { local: ["Яйця на олії", "Кефір з бананом"], draft: ["Лаваш-рол"], ai_requests: 0 }
  status: fixed
