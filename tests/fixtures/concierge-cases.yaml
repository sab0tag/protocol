# Корпус ІІ-помічника (SPEC.md D91). Відповідь ІІ не порівнюється за текстом — перевіряються властивості.
# scenario:
#   why        — «Чому позначено?»: код, без моделі. phrase (profile demo) → відмітки перевірки; expect.mentions — що є в поясненні
#   danger     — небезпечна ознака у вільному тексті → картка 103 замість будь-якої відповіді (код)
#   not_found  — живий прогін моделі: scripts/eval-concierge.ts, кожен рядок 5 разів (межа має триматися завжди)
#                expect: candidates_from_db, candidates_max, includes_any (хоча б одна з назв), empty (порожньо)
#   goal_topup, near_limit, chat — сценарії 3–4 і розмова: ще не побудовані, рядки open
# status: fixed | open; рядки не видаляються. Нові знахідки щотижневого розбору — сюди, зі status: open.

