# Корпус призначень (SPEC.md D101, D103; ТЗ 18.10, крок 0). Фото виписок і призначень з еталонним розбором — лише
# знеособлені або вигадані. Живий прогін (мережа, модель, гроші): `npm run eval:prescriptions`, кожен рядок 3 рази.
# Жорстке правило: неправильна доза чи препарат зі статусом ✓ — провал, навіть якщо решта вірно. Невірний рядок зі
# статусом ? — допустимо (людина звірить). Рукописні: частина рядків чесно йде в ✗.
# pages — файли поруч; medicines — що має бути прочитано (dose рівно як на папері); perDay / durationDays / asNeeded /
# withFood — якщо задано, перевіряються; visit — дата огляду, окремим рядком від аналізів; tests — скільки аналізів
# без дати (число або [від, до]); diet — код пресету; absent — чого не має бути ніде у відповіді (ПІБ, дата народження, діагноз, лікарі).
# status: fixed | open; рядки не видаляються.

