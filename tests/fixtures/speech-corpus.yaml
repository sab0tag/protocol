# Корпус експерименту з голосом (SPEC.md D175, ТЗ «подключение и адаптация Soniox», розділ «Эксперимент»). 40 фраз.
# say — еталон: що людина читає вголос на #/dev/speech; expect — що з нього робить поле «Скажіть або напишіть…»
# (readOneInput у контексті CORPUS_CONTEXT з src/domain/speechCorpus.ts: 08:30, ранкові дози не відмічено).
# forms — ті самі слова, як їх може написати рушій (цифри замість слів, пунктуація, великі літери, латиниця, апостроф):
# кожна має читатися так само, як еталон (tests/unit/speechCorpus.test.ts). Нова форма, що ламає розбір, — чиниться
# в розборі (одна нормалізація), не особливим кодом під Soniox: той самий текст можна надрукувати.
# card — чернетка на екрані для команд D107. Групи й кількість — з ТЗ: їжа укр. 14, рос. і суміш 6, ліки з дозою 8,
# вода 4, команди 6, питання 2.

# ── їжа, українська (14) ──
- id: food-oats-stop
  group: food-uk
  say: "на сніданок вівсянка два яйця кава з молоком це все"
  forms: ["На сніданок вівсянка, 2 яйця, кава з молоком. Це все.", "на сніданок вівсянка 2 яйця кава з молоком це все"]
  expect: { kind: food, items: ["Вівсян", "Яйце", "Кава з молоком"] }
- id: food-eggs-coffee
  group: food-uk
  say: "два яйця і кава з молоком, це все"
  forms: ["Два яйця і кава з молоком. Це все.", "2 яйця і кава з молоком, це все"]
  expect: { kind: food, items: ["Яйце", "Кава з молоком"] }
- id: food-buckwheat-chicken
  group: food-uk
  say: "гречка з куркою і чай"
  forms: ["Гречка з куркою і чай."]
  expect: { kind: food, items: ["Гречка з куркою", "Чай"] }
- id: food-borsch-bread
  group: food-uk
  say: "борщ і шматок хліба"
  forms: ["Борщ і шматок хліба.", "борщ і 1 шматок хліба"]
  expect: { kind: food, items: ["Борщ", "Білий хліб"] }
- id: food-banana
  group: food-uk
  say: "з'їв банан"
  forms: ["З’їв банан.", "зʼїв банан", "з'їв банан"]
  expect: { kind: food, items: ["Банан"] }
- id: food-bread-grams
  group: food-uk
  say: "шістдесят грамів хліба і сир"
  forms: ["60 грамів хліба і сир.", "60 г хліба і сир"]
  expect: { kind: food }
- id: food-cottage-cheese
  group: food-uk
  say: "сирники зі сметаною"
  forms: ["Сирники зі сметаною."]
  expect: { kind: food }
- id: food-apple-nuts
  group: food-uk
  say: "яблуко і жменя горіхів"
  forms: ["Яблуко і жменя горіхів."]
  expect: { kind: food }
- id: food-fish-rice
  group: food-uk
  say: "на вечерю риба з рисом"
  forms: ["На вечерю риба з рисом."]
  expect: { kind: food }
- id: food-mash-cutlet
  group: food-uk
  say: "картопляне пюре і котлета"
  forms: ["Картопляне пюре і котлета."]
  expect: { kind: food }
- id: food-yogurt
  group: food-uk
  say: "склянка кефіру і печиво"
  forms: ["Склянка кефіру і печиво.", "1 склянка кефіру і печиво"]
  expect: { kind: food }
- id: food-soup-salad
  group: food-uk
  say: "на обід суп і салат з огірків"
  forms: ["На обід суп і салат з огірків."]
  expect: { kind: food }
- id: food-omelette
  group: food-uk
  say: "омлет і чай без цукру"
  forms: ["Омлет і чай без цукру."]
  expect: { kind: food }
- id: food-porridge-half
  group: food-uk
  say: "пів порції вівсянки"
  forms: ["Пів порції вівсянки.", "0,5 порції вівсянки"]
  expect: { kind: food }

