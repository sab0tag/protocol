# ── Дієти за Наказом МОЗ №931 + особисте обмеження (D90) ─────────────
# Профіль «<дієта>_<обмеження>»: shd = ЩД, ovd = ОВД, vbd = ВБД, nbd = НБД, nkd = НКД, d9 = №9, d1a = №1а, d4 = №4.
# fixed — особисте обмеження працює поруч із дієтою. Відмітки самої дієти (open) чекають правил, перевірених дієтологом:
# поки правил немає, неперевірена дієта їжу не перевіряє — і ці рядки мають падати.

