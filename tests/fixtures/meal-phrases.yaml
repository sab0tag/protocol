# Эталонные фразы записи еды (SPEC.md D85). Каждая строка проходит полный путь «Записати їжу»: readMeal() — та же
# функция, что вызывает экран при наборе. Строки не удаляются: исправленная остаётся навсегда как регрессия.
# Поля и правила — в ТЗ «Эталонные фразы и разбор записи еды» (17.10.2026):
#   profile: clean — пустой профиль; demo — «Подивитись на прикладі» (план-пример и две недели записей)
#   expect: позиции по порядку; name — точно как в базе; qty/unit — как в «Розпізнано»; grams — [мин, макс]
#   flags (demo) — подмножество отметок «Перевірки за планом» (сообщение или тег правила); alt_excludes — чего нет в «або:»
#   not_found — части, которые дают «— не знайдено»; status: fixed | open; found — дата; note — что сейчас (для open)

