# Еталонні фрази для розбору запису їжі в «Протоколі».
#
# Кожен рядок проганяється через ПОВНИЙ шлях: набраний текст → розбір фрази
# (кількість, одиниця, межі частин) → пошук → вибір першого варіанта →
# перевірка за планом. Не через пошук напряму.
#
# Поля:
#   id       — стабільний ідентифікатор
#   phrase   — рівно те, що набрала або надиктувала людина
#   profile  — clean (без історії) | demo (план-приклад, у ньому: порушена
#              глікемія, непереносимість лактози, оксалатні камені)
#   expect   — позиції в тому порядку, як мають з'явитися
#     name     — назва першого варіанта (точно, як у базі)
#     qty/unit — кількість і одиниця, як показано в рядку
#     grams    — [мін, макс], допуск на округлення
#     flags    — що має сказати «Перевірка за планом лікаря» (лише для demo)
#     alt_excludes — чого не має бути серед «або:»
#   not_found — частини фрази, які мають дати «— не знайдено — додайте вручну»
#   status   — fixed (вже проходить, тримати як регресію) | open (ще падає)
#   found    — дата, коли знайдено
#
# Правило для нових рядків: аналітик додає зі status: open, розробник
# перемикає на fixed, коли тест проходить. Рядки не видаляються.

# ── Цукор і «з / без» ─────────────────────────────────────────────

- id: sugar-with
  phrase: "чай з цукром"
  profile: demo
  expect:
    - { name: "Чай з цукром", qty: 1, unit: склянка, grams: [240, 260], flags: ["Доданий цукор"] }
  status: fixed
  found: 2026-10-17

- id: sugar-without
  phrase: "чай без цукру"
  profile: demo
  expect:
