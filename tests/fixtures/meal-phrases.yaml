# ── Були відкриті; перемкнуто на fixed 17.10 (D85–D86) ─────────────

- id: case-syru
  phrase: "сиру"
  profile: clean
  expect:
    - { name: "Сир кисломолочний 5 %" }
  status: fixed
  found: 2026-10-17
  note: "Було: дає «Сирна запіканка». «кисломолочного сиру» знаходиться правильно."

- id: spoon-unit-kept
  phrase: "3 ложки сиру"
  profile: clean
  expect:
    - { name: "Сир кисломолочний 5 %", qty: 3, unit: ст. л., grams: [50, 75] }
  status: fixed
  found: 2026-10-17
  note: "Було: «Сирна запіканка · 3 порції ≈ 800 г»: хибний продукт + ложки стали порціями."

- id: unit-missing-on-product
  phrase: "склянка гречки"
  profile: clean
  expect:
    - { name: "Гречка варена", grams: [150, 250] }
  status: fixed
  found: 2026-10-17
  note: "Було: множилась порція. Якщо в продукту немає названої одиниці — перерахувати в грами, а не множити порцію."

- id: dictation-dot-digit
  phrase: "Кава з молоком. 1,5 склянки кефіру"
  profile: clean
  expect:
    - { name: "Кава з молоком (без цукру)" }
    - { name: "Кефір 2,5 %", qty: 1.5, unit: склянка, grams: [365, 385] }
  status: fixed
  found: 2026-10-17
  note: "Було: уся фраза — «не знайдено». Крапка перед цифрою має ділити частини."

- id: dictation-dot-lower
  phrase: "кава з молоком. 1,5 склянки кефіру"
  profile: clean
  expect:
    - { name: "Кава з молоком (без цукру)" }
    - { name: "Кефір 2,5 %", qty: 1.5, unit: склянка }
  status: fixed
  found: 2026-10-17

- id: dictation-capital
  phrase: "Два яйця. Кава з молоком."
  profile: clean
  expect:
    - { name: "Яйце варене", qty: 2, unit: шт }
    - { name: "Кава з молоком (без цукру)" }
  status: fixed
  found: 2026-10-17
  note: "Було: склеювалось. «Два яйця.» уже проходить; рядок фіксує склейку з наступною частиною."

