name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate isolated pilot Compose
        run: |
          touch server/.env.pilot
          docker compose -f server/compose.pilot.yml config --quiet
          rm server/.env.pilot
      - name: Verify pilot image data and backup permissions
        run: |
          docker build -t protocol-pilot-permissions ./server
          docker run --rm --entrypoint node protocol-pilot-permissions -e 'const fs=require("node:fs"); for (const dir of ["/data", "/backups"]) { const f=dir+"/.ci-write"; fs.writeFileSync(f,"ok"); fs.unlinkSync(f); }'
  server:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: mockup-screen-matrix, path: test-results/mockup-*.png, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright, path: test-results, retention-days: 7 }
