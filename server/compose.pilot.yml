# Isolated clinic pilot API. Run from server/ with a dedicated .env.pilot.
# Never attach the production 'data' volume or production DB_PATH.
# HTTPS must be terminated by an explicitly configured reverse proxy.
services:
  pilot-api:
    build: .
    restart: unless-stopped
    env_file: .env.pilot
    environment:
      DB_PATH: /pilot-data/protocol-pilot.db
      PORT: "8080"
      CLINIC_IDENTITY_V2: "off"
    volumes:
      - pilot_data:/pilot-data
      - ./pilot-backups:/backups
    networks:
      - pilot_edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pilot_data:
    name: protocol_clinic_pilot_data
networks:
  pilot_edge:
    name: protocol_clinic_pilot_edge
    internal: true
